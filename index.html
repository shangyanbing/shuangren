<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>游戏下载中心</title>
    <style>
        /* ===== 全局重置 & 基础 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            /* 背景图片：PAC 文件夹中的 cover（请根据实际格式调整扩展名） */
            background-image: url('PAC/cover.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            /* 备用背景色（图片加载失败时显示） */
            background-color: #0b0b1a;
            padding: 20px;
            /* 在背景上叠加一层半透明遮罩，提升文字可读性 */
            position: relative;
        }

        /* 遮罩层 - 覆盖在背景之上，所有内容之下 */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.55);
            /* 可调节透明度，让背景若隐若现 */
            backdrop-filter: blur(2px);
            z-index: 0;
        }

        /* ===== 主容器 ===== */
        .container {
            position: relative;
            z-index: 1;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: stretch;
            gap: 40px;
            max-width: 1100px;
            width: 100%;
            /* 整体淡入动画 */
            animation: fadeInUp 1s ease-out both;
        }

        /* ===== 每个游戏卡片 ===== */
        .game-card {
            flex: 1 1 360px;
            min-width: 280px;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.10);
            border-radius: 32px;
            padding: 40px 30px 45px;
            box-shadow:
                0 30px 60px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1),
                box-shadow 0.4s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .game-card:hover {
            transform: translateY(-8px) scale(1.01);
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.15);
        }

        /* ===== 游戏标题 ===== */
        .game-title {
            font-size: 2.6rem;
            font-weight: 800;
            letter-spacing: 3px;
            margin-bottom: 10px;
            /* 金色渐变文字 */
            background: linear-gradient(135deg, #f7e05e, #f6b03c, #f7e05e);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 40px rgba(246, 176, 60, 0.25);
            animation: shimmerGold 4s ease-in-out infinite alternate;
            position: relative;
        }

        /* 标题装饰下划线 */
        .game-title::after {
            content: '';
            display: block;
            width: 60px;
            height: 3px;
            margin: 10px auto 0;
            background: linear-gradient(90deg, transparent, #f6b03c, transparent);
            border-radius: 2px;
            opacity: 0.7;
        }

        /* 标题旁边的小装饰 */
        .game-title .icon {
            -webkit-text-fill-color: initial;
            color: #f6b03c;
            font-size: 2rem;
            margin: 0 6px;
        }

        /* ===== 按钮容器 ===== */
        .btn-group {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 16px;
            margin-top: 28px;
            width: 100%;
        }

        /* ===== 下载按钮 ===== */
        .btn-download {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 34px;
            min-width: 140px;
            flex: 1 1 auto;
            border-radius: 60px;
            font-size: 1.1rem;
            font-weight: 700;
            color: #fff;
            text-decoration: none;
            letter-spacing: 1px;
            border: none;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        /* 按钮光泽 */
        .btn-download::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.25) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
        }

        .btn-download:hover::before {
            opacity: 1;
        }

        /* 电脑版 - 蓝色科技渐变 */
        .btn-pc {
            background: linear-gradient(135deg, #4facfe, #2b6ef0);
            box-shadow: 0 6px 24px rgba(47, 128, 237, 0.35);
        }

        .btn-pc:hover {
            transform: translateY(-3px) scale(1.04);
            box-shadow: 0 12px 36px rgba(47, 128, 237, 0.5);
        }

        .btn-pc:active {
            transform: scale(0.94);
            box-shadow: 0 2px 10px rgba(47, 128, 237, 0.3);
        }

        /* 手机版 - 金色活力渐变 */
        .btn-mobile {
            background: linear-gradient(135deg, #f6d365, #f5a623);
            box-shadow: 0 6px 24px rgba(245, 166, 35, 0.35);
        }

        .btn-mobile:hover {
            transform: translateY(-3px) scale(1.04);
            box-shadow: 0 12px 36px rgba(245, 166, 35, 0.5);
        }

        .btn-mobile:active {
            transform: scale(0.94);
            box-shadow: 0 2px 10px rgba(245, 166, 35, 0.3);
        }

        /* 按钮中的小图标 */
        .btn-download .emoji {
            font-size: 1.2rem;
            line-height: 1;
            filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.2));
        }

        /* ===== 右侧卡片微调（可加不同的装饰色） ===== */
        .game-card.right .game-title {
            background: linear-gradient(135deg, #f9d976, #f39c12, #f9d976);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmerGold 4s ease-in-out infinite alternate;
        }

        .game-card.right .game-title::after {
            background: linear-gradient(90deg, transparent, #f39c12, transparent);
        }

        /* ===== 动画定义 ===== */

        /* 卡片淡入 + 上移 */
        @keyframes fadeInUp {
            0% {
                opacity: 0;
                transform: translateY(40px) scale(0.96);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* 金色流光 */
        @keyframes shimmerGold {
            0% {
                background-position: 0% 50%;
            }
            100% {
                background-position: 100% 50%;
            }
        }

        /* ===== 响应式 ===== */

        /* 平板及小屏笔记本 */
        @media (max-width: 820px) {
            .container {
                gap: 30px;
            }

            .game-card {
                flex: 1 1 300px;
                padding: 32px 24px 38px;
            }

            .game-title {
                font-size: 2.2rem;
            }

            .btn-download {
                padding: 12px 24px;
                min-width: 120px;
                font-size: 1rem;
            }
        }

        /* 手机 */
        @media (max-width: 480px) {
            body {
                padding: 16px;
                background-attachment: scroll;
            }

            body::before {
                backdrop-filter: blur(4px);
                /* 手机上加强模糊，提升文字可读性 */
            }

            .container {
                gap: 24px;
            }

            .game-card {
                flex: 1 1 100%;
                min-width: 0;
                padding: 28px 18px 32px;
                border-radius: 24px;
            }

            .game-title {
                font-size: 1.8rem;
                letter-spacing: 1px;
            }

            .game-title .icon {
                font-size: 1.4rem;
            }

            .btn-group {
                gap: 12px;
                flex-direction: column;
                align-items: center;
            }

            .btn-download {
                width: 100%;
                max-width: 260px;
                padding: 14px 20px;
                font-size: 1rem;
                justify-content: center;
            }

            .game-card:hover {
                transform: translateY(-4px) scale(1.005);
            }
        }

        /* 超小屏手机 */
        @media (max-width: 360px) {
            .game-title {
                font-size: 1.5rem;
            }

            .btn-download {
                font-size: 0.9rem;
                padding: 12px 16px;
                min-width: 100px;
            }
        }

        /* ===== 可选：滚动条美化 ===== */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(246, 176, 60, 0.4);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(246, 176, 60, 0.6);
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- ====== 左：霜刃对决 ====== -->

            <h1 class="game-title">
                <span class="icon">⚔️</span> 霜刃对决
            </h1>

    </div>

</body>
</html>
